[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cerebro"
version = "0.1.0"
description = "PostgreSQL + Obsidian + Ollama endpoints for active-recall spaced repetition"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2.5,<3",
    "python-frontmatter>=1.1,<2",
    "watchdog>=5,<7",
    "ollama>=0.4,<1",
    "python-telegram-bot[job-queue]>=21,<23",
    "google-genai>=1,<2",
]

[project.optional-dependencies]
test = []

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
